name: Bug report
description: Something doesn't work as it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: UpZe version
      description: Settings › About
      placeholder: "1.0.0 (21)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Lenovo Tab M8, Android 10"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Music source involved (if any)
      multiple: true
      options: [YouTube Music, JioSaavn, On this device, Subsonic / Navidrome, Jellyfin, Audius, Jamendo, Internet Archive, SoundCloud, Not playback related]
  - type: textarea
    id: logs
    attributes:
      label: Playback log or crash report
      description: Settings › About › Playback log / Last crash report › Share. Check it for anything private before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release.
