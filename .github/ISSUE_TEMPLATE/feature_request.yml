name: Feature request
description: Suggest an idea for UpZe
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I always have to … when …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This doesn't need piracy, DRM circumvention or streaming audio from Spotify.
          required: true
