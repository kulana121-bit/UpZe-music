name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 37 and build-tools 36.0.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1); fi
          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"; ls "$ANDROID_HOME/build-tools" || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[0-9]" | head -8 || true
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          if [ -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "SDK platform 37 and build-tools 36.0.0 already installed"
          else
            "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" || "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Unit tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UpZe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
